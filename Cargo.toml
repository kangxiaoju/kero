[package]
name = "kero"
version = "0.1.0"
edition = "2021"
description = "Unified CLI to install and manage EasyTier (mesh networking) + Syncthing (decentralized sync)"

[[bin]]
name = "kero"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
ratatui = "0.28"
crossterm = "0.28"
hostname = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
